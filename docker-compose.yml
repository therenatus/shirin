services:
  postgres:
    image: postgres:16-alpine
    container_name: shirin-postgres
    environment:
      POSTGRES_DB: shirin_db
      POSTGRES_USER: shirin_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shirin_password_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shirin-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shirin_user -d shirin_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    container_name: shirin-seaweedfs
    entrypoint: ["/infra/entrypoint.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shirin_dev_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shirin_dev_secret_key}
      S3_BUCKET: shirin
    ports:
      - "8333:8333"   # S3 API (public reads of the shirin bucket)
    volumes:
      - seaweedfs_data:/data
      - ./infra/seaweedfs/entrypoint.sh:/infra/entrypoint.sh:ro
    networks:
      - shirin-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: shirin-redis
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data
    networks:
      - shirin-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: shirin-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://shirin_user:${DB_PASSWORD:-shirin_password_2024}@postgres:5432/shirin_db
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your_jwt_refresh_secret_key_change_in_production}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      SMS_STUB: "true"
      S3_ENDPOINT: seaweedfs
      S3_PORT: "8333"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-shirin_dev_access_key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-shirin_dev_secret_key}
      S3_USE_SSL: "false"
      S3_BUCKET: shirin
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:8333}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shirin-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run start:dev"

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile.dev
    container_name: shirin-admin
    environment:
      REACT_APP_API_URL: http://localhost:3000/api/v1
      REACT_APP_WS_URL: ws://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - shirin-network
    volumes:
      - ./admin-dashboard:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
    driver: local
  seaweedfs_data:
    driver: local
  redis_data:
    driver: local

networks:
  shirin-network:
    driver: bridge
